spring:
  application:
    name: passenger-service

  # R2DBC (Reactivo)
  r2dbc:
    url: r2dbc:postgresql://postgres:5432/passengerdb
    username: passengeruser
    password: passengerpass

  # Flyway (Migraciones con JDBC)
  flyway:
    enabled: true
    url: jdbc:postgresql://postgres:5432/passengerdb  # ✅ jdbc://
    user: passengeruser
    password: passengerpass
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/eco-ride-dev

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ecouser
    password: ecopass

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: ${spring.application.name}

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method

logging:
  level:
    com.unimag.passenger_service: DEBUG
    org.springframework.web: INFO
    org.springframework.r2dbc: DEBUG