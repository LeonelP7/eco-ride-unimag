version: '3.8'

services:

  apigateway-service:
    build: ./api-gateway
    container_name: api-gateway-service
    ports:
      - "8081:8080"
    depends_on:
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ecouser
      SPRING_RABBITMQ_PASSWORD: ecopass
    networks:
      - eco-network

  # PostgreSQL para TripService
  trip-db:
    image: postgres:15-alpine
    container_name: eco-trip-db
    environment:
      POSTGRES_DB: tripdb
      POSTGRES_USER: tripuser
      POSTGRES_PASSWORD: trippass
    ports:
      - "5433:5432"
    volumes:
      - trip-data:/var/lib/postgresql/data
    networks:
      - eco-network

  payment-db:
    image: postgres:15-alpine
    container_name: eco-payment-db
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: paymentuser
      POSTGRES_PASSWORD: paymentpass
    ports:
      - "5434:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data
    networks:
      - eco-network


  # Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: eco-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - eco-network

  # ============================================
  # RABBITMQ - Message Broker
  # ============================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eco-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ecouser
      RABBITMQ_DEFAULT_PASS: ecopass
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"    # Puerto AMQP
      - "15672:15672"  # Puerto Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - eco-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # KEYCLOAK - Servidor de Autenticación
  # ============================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    container_name: eco-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    command:
      - start-dev
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eco-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8180/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================
  # POSTGRESQL - Base de datos para Keycloak
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: eco-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eco-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # REDIS - Para Rate Limiting
  # ============================================
#  redis:
#    image: redis:7-alpine
#    container_name: eco-redis
#    command: redis-server --requirepass ecoredis123
#    ports:
#      - "6379:6379"
#    volumes:
#      - redis_data:/data
#    networks:
#      - eco-network
#    healthcheck:
#      test: [ "CMD", "redis-cli", "-a", "ecoredis123", "ping" ]
#      interval: 10s
#      timeout: 3s
#      retries: 5

  # ============================================
  # EUREKA SERVER
  # ============================================
  eureka-server:
    image: steeltoeoss/eureka-server:latest
    container_name: eco-eureka
    ports:
      - "8761:8761"
    environment:
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false
    networks:
      - eco-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  eco-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  trip-data:
  payment-data:
  rabbitmq_data: