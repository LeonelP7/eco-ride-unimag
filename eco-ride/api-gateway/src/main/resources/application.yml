
server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ============================================
  # GATEWAY CONFIGURATION
  # ============================================
  cloud:
    gateway:
      default-filters:
        - TokenRelay=
        - RemoveRequestHeader=Cookie
      routes:
        # Trip Service Routes
        - id: trip-service
          uri: lb://trip-service
          predicates:
            - Path=/api/v1/trips/**,/api/v1/reservations/**
          filters:
            - StripPrefix=0

        # Passenger Service Routes
        - id: passenger-service
          uri: lb://passenger-service
          predicates:
            - Path=/api/v1/passengers/**,/api/v1/drivers/**,/api/v1/ratings/**
          filters:
            - StripPrefix=0

  # ============================================
  # SECURITY CONFIGURATION
  # ============================================
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/eco-ride-dev
            authorization-uri: http://localhost:8180/realms/eco-ride-dev/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/eco-ride-dev/protocol/openid-connect/token
            user-info-uri: http://localhost:8180/realms/eco-ride-dev/protocol/openid-connect/userinfo
            jwk-set-uri: http://localhost:8180/realms/eco-ride-dev/protocol/openid-connect/certs
            user-name-attribute: preferred_username

        registration:
          # SPA/Web Client - Authorization Code + PKCE
          keycloak:
            provider: keycloak
            client-id: eco-web-client
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
              - trips:read
              - trips:write
              - payments:charge
              - notifications:send
            client-authentication-method: none

          # Internal Service-to-Service Client
          eco-internal:
            provider: keycloak
            client-id: eco-internal-client
            client-secret: GKL15VM9W3Hq1F5v9BV317fYuVh6p5bO
            authorization-grant-type: client_credentials
            scope:
              - trips:read
              - trips:write
              - payments:charge

      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/eco-ride-dev
          jwk-set-uri: http://localhost:8180/realms/eco-ride-dev/protocol/openid-connect/certs

# ============================================
# EUREKA DISCOVERY
# ============================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: api-gateway:${random.value}

# ============================================
# ACTUATOR & MONITORING
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    gateway:
      enabled: true
  metrics:
    tags:
      application: api-gateway
  prometheus:
    metrics:
      export:
        enabled: true

# ============================================
# LOGGING
# ============================================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"