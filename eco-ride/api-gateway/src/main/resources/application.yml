server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ============================================
  # GATEWAY CONFIGURATION
  # ============================================
  cloud:
    gateway:
      default-filters:
        - TokenRelay=
        - RemoveRequestHeader=Cookie
      routes:
        # Trip Service Routes
        - id: trip-service
          uri: lb://trip-service
          predicates:
            - Path=/api/v1/trips/**
            - Path=/api/v1/reservations/**
          filters:
            - Path=StripPrefix=0

        # Passenger Service Routes
        - id: passenger-service
          uri: lb://passenger-service
          predicates:
            - Path=/api/v1/passengers/**
            - Path=/api/v1/drivers/**
            - Path=/api/v1/ratings/**
          filters:
            - StripPrefix=0

    # Configuración de loadbalancer (mismo nivel que gateway)
    loadbalancer:
      retry:
        enabled: true

  # ============================================
  # SECURITY CONFIGURATION
  # ============================================
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/eco-ride-dev
        #            authorization-uri: http://keycloak:8080/realms/eco-ride-dev/protocol/openid-connect/auth
        #            token-uri: http://keycloak:8080/realms/eco-ride-dev/protocol/openid-connect/token
        #            user-info-uri: http://keycloak:8080/realms/eco-ride-dev/protocol/openid-connect/userinfo
        #            jwk-set-uri: http://keycloak:8080/realms/eco-ride-dev/protocol/openid-connect/certs

        registration:
          # SPA/Web Client - Authorization Code + PKCE
          keycloak:
            provider: keycloak
            client-id: eco-web-client
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
            #              - trips:read
            #              - trips:write
            #              - payments:charge
            #              - notifications:send
            client-authentication-method: none

          # Internal Service-to-Service Client
          eco-internal:
            provider: keycloak
            client-id: eco-internal-client
            client-secret: GF46BQ3wEuNkpNQzn67rRSoMrl3kDvOa
            authorization-grant-type: client_credentials
            scope:
              - trips:read
              - trips:write
              - payments:charge

#      resourceserver:
#        jwt:
#          issuer-uri: http://keycloak:8080/realms/eco-ride-dev
#          jwk-set-uri: http://keycloak:8080/realms/eco-ride-dev/protocol/openid-connect/certs

# ============================================
# EUREKA DISCOVERY
# ============================================
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: api-gateway:${random.value}

# ============================================
# ACTUATOR & MONITORING
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    gateway:
      enabled: true
  metrics:
    tags:
      application: api-gateway
  prometheus:
    metrics:
      export:
        enabled: true

# ============================================
# LOGGING
# ============================================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"